<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#12102e"/>
      <stop offset="100%" stop-color="#070712"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="hex-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 10 L 40 30 L 20 40 L 0 30 L 0 10 Z" fill="none" stroke="#232148" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#hex-grid)"/>

  <!-- Glowing Accent Lines -->
  <line x1="120" y1="0" x2="120" y2="440" stroke="#6366f1" stroke-width="1.2" opacity="0.2"/>
  <line x1="1160" y1="0" x2="1160" y2="440" stroke="#06b6d4" stroke-width="1.2" opacity="0.2"/>

  <!-- Left Header Information -->
  <g transform="translate(80, 70)">
    <!-- Security Pill Badge -->
    <rect x="0" y="0" width="250" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#818cf8"/>
    <text x="32" y="21" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AES-256-GCM SECRETS VAULT</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">DevVault (Env-Store)</text>
    <text x="0" y="132" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">Secure Secrets Manager</text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Zero-Plaintext Encrypted Environment Variables, RBAC Teams &amp; Immutable Audit Logs
    </text>

    <!-- Stack Chips -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e1b4b" stroke="#312e81"/>
      <text x="52" y="18" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Next.js 14</text>

      <rect x="115" y="0" width="95" height="28" rx="6" fill="#1e1b4b" stroke="#312e81"/>
      <text x="162" y="18" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Node.js 20</text>

      <rect x="220" y="0" width="100" height="28" rx="6" fill="#1e1b4b" stroke="#312e81"/>
      <text x="270" y="18" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">MongoDB 7</text>

      <rect x="330" y="0" width="85" height="28" rx="6" fill="#1e1b4b" stroke="#312e81"/>
      <text x="372" y="18" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Redis 7</text>
    </g>
  </g>

  <!-- Right Visual: Secure Vault Card & Encrypted Chip Display -->
  <g transform="translate(700, 50)">
    <!-- Container Card -->
    <rect x="0" y="0" width="500" height="340" rx="16" fill="#0d0d1e" stroke="#2d2b56" stroke-width="1.8"/>
    
    <!-- Top Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 484 0 Q 500 0 500 16 L 500 40 L 0 40 Z" fill="#14132e"/>
    <circle cx="22" cy="20" r="5" fill="#ef4444"/>
    <circle cx="38" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5" fill="#10b981"/>
    <text x="250" y="25" fill="#818cf8" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">project-secrets.vault [ENCRYPTED]</text>

    <!-- Secret Keys List Display -->
    <g transform="translate(24, 60)">
      <!-- Secret 1 -->
      <rect x="0" y="0" width="452" height="52" rx="8" fill="#161536" stroke="#2f2b66"/>
      <circle cx="20" cy="26" r="6" fill="#10b981"/>
      <text x="36" y="24" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">DATABASE_URL</text>
      <text x="36" y="42" fill="#6366f1" font-family="monospace" font-size="11">gcm:8f1e3c...7a91 (v3 • 2m ago)</text>
      <rect x="360" y="14" width="76" height="24" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="398" y="30" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">REVEAL</text>

      <!-- Secret 2 -->
      <rect x="0" y="64" width="452" height="52" rx="8" fill="#161536" stroke="#2f2b66"/>
      <circle cx="20" cy="90" r="6" fill="#10b981"/>
      <text x="36" y="88" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">STRIPE_SECRET_KEY</text>
      <text x="36" y="106" fill="#6366f1" font-family="monospace" font-size="11">gcm:2b4d9a...11ef (v1 • 1d ago)</text>
      <rect x="360" y="78" width="76" height="24" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="398" y="94" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">REVEAL</text>

      <!-- Secret 3 -->
      <rect x="0" y="128" width="452" height="52" rx="8" fill="#161536" stroke="#2f2b66"/>
      <circle cx="20" cy="154" r="6" fill="#10b981"/>
      <text x="36" y="152" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">JWT_SECRET_KEY</text>
      <text x="36" y="170" fill="#6366f1" font-family="monospace" font-size="11">gcm:5e8c1f...9b04 (v2 • 3d ago)</text>
      <rect x="360" y="142" width="76" height="24" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="398" y="158" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">REVEAL</text>
    </g>

    <!-- Bottom Shield Badge -->
    <g transform="translate(24, 260)">
      <rect x="0" y="0" width="452" height="56" rx="8" fill="#080814" stroke="#1f1e3d"/>
      <text x="16" y="24" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="700">🔒 ENCRYPTION SPECIFICATION</text>
      <text x="16" y="42" fill="#94a3b8" font-family="monospace" font-size="11">Algorithm: AES-256-GCM • IV: 12-byte • Auth Tag: 16-byte</text>
    </g>
  </g>
</svg>
